name: Release watchtower

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: AWS CLI version to build; leave empty for the latest version
        required: false
        type: string
      force:
        description: Rebuild and replace assets even when the release is complete
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-watchtower-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      need_build: ${{ steps.release.outputs.need_build }}
    steps:
      - name: Select version and inspect release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ -z "$version" ]]; then
            version=$(gh api 'repos/aws/aws-cli/tags?per_page=1' --jq '.[0].name')
          fi

          if [[ ! "$version" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid AWS CLI version: $version" >&2
            exit 1
          fi

          ASSETS_COMPLETE=false
          if RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" 2>/dev/null); then
            if jq -e '
              [.assets[] | select(.size > 0) | .name] | sort ==
              ["aws-aarch64.AppImage", "aws-x86_64.AppImage"]
            ' <<< "$RELEASE" >/dev/null; then
              ASSETS_COMPLETE=true
            fi
          fi

          need_build=false
          if [[ "${FORCE:-false}" == 'true' || "$ASSETS_COMPLETE" != 'true' ]]; then
            need_build=true
          fi

          echo "AWS CLI version: ${version}"
          echo "Release assets complete: $ASSETS_COMPLETE"
          echo "Build required: ${need_build}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "need_build=${need_build}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.need_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.arch }} AppImage
        run: ./build '${{ needs.check.outputs.version }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: aws-${{ matrix.arch }}
          path: aws-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.need_build == 'true' && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aws-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" \
              --notes 'This build is automated via GitHub Actions.'
          fi
          gh release upload "$tag" dist/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
